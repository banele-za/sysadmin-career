  title: "Use grep and regular expressions to analyze text"
  area: Understand and use essential tools
remote.ssh:
  title: "Access remote systems using SSH"
  area: Understand and use essential tools
users.switch:
  title: "Log in and switch users in multi-user targets"
  area: Understand and use essential tools
files.archive:
  title: "Archive, compress, unpack, and uncompress files using tar, gzip, and bzip2"
  area: Understand and use essential tools
files.edit:
  title: "Create and edit text files"
  area: Understand and use essential tools
files.manage:
  title: "Create, delete, copy, and move files and directories"
  area: Understand and use essential tools
files.links:
  title: "Create hard and soft links"
  area: Understand and use essential tools
perm.ugo:
  title: "List, set, and change standard ugo/rwx permissions"
  area: Understand and use essential tools
docs.read:
  title: "Locate, read, and use system documentation including man, info, and files in /usr/share/doc"
  area: Understand and use essential tools

