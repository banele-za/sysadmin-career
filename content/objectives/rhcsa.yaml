# RHCSA (EX200) objective keys referenced by tickets.
#
# Source: the official "Study points for the exam" on
# https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam
# (exam based on Red Hat Enterprise Linux 10), copied on 2026-11-10.
# Titles are Red Hat's wording; keys are ours. Tickets list keys, never text
# (tests/test_engine.py checks every key exists). When Red Hat changes the
# list, update this file and fix any ticket the test then flags.

# ---- Understand and use essential tools ---------------------------------------
shell.commands:
  title: "Access a shell prompt and issue commands with correct syntax"
